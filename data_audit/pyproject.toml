[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dialect-data-audit"
version = "0.1.0"
description = "AmE/BrE data audit code for pretraining and post-training corpora."
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.18,<4.0",
  "tqdm>=4.60",
  "scipy>=1.7",
  "pandas>=1.5",
  "nltk>=3.8",
  "requests>=2.28",
]

[tool.setuptools.packages.find]
where = ["src"]
